# Pin a version prefix for tools that write project artifacts (lockfiles) or
# break across majors; bump deliberately. Float the rest.
[tools]
# core, depended by mise
usage = "latest"

# language toolchains
go = "latest"
rust = "stable"
uv = "0.12"
node = "24"
pnpm = "11"

# cli tools
# Verify with: mise registry <tool>
agent-browser = "latest"
ffmpeg = "latest"
yazi = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
lazygit = "latest"
ripgrep = "latest"
tmux = "latest"
zoxide = "latest"
hunk = "latest"
imagemagick = "latest"
websocat = "latest"

#npm backend
"npm:@antfu/ni" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@playwright/cli" = "latest"

[settings]
experimental = false
fetch_remote_versions_cache = "2d"

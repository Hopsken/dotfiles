# Pin a version prefix for tools that write project artifacts (lockfiles) or
# break across majors; bump deliberately. Float the rest.
[tools]
go = "latest"
node = "24"
rust = "stable"
uv = "0.12"
"npm:@antfu/ni" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
pnpm = "11"
usage = "latest"
agent-browser = "latest"
ffmpeg = "latest"
yazi = "latest"

# Shell CLIs; short names mostly resolve to the aqua backend (prebuilt binaries).
# Verify with: mise registry <tool>
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
lazygit = "latest"
ripgrep = "latest"
tmux = "latest"
zoxide = "latest"

[settings]
experimental = false
fetch_remote_versions_cache = "2d"

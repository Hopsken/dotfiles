# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse off

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vi keys in copy mode (explicit rather than inferred from $EDITOR)
set-window-option -g mode-keys vi

# Catppuccin theme (declared here so TPM/bootstrap installs it into plugins/tmux)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_number_position 'left'

# Window: inactive shows number + window name
set -g @catppuccin_window_number '#I'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_number_color '#{@thm_blue}'
set -g @catppuccin_window_text_color '#{@thm_surface_0}'

# Window: active shows number + last 2 segments of current path
set -g @catppuccin_window_current_number '#I'
set -g @catppuccin_window_current_text ' #(echo "#{pane_current_path}" | rev | cut -d"/" -f-2 | rev)'
set -g @catppuccin_window_current_number_color '#{@thm_peach}'
set -g @catppuccin_window_current_text_color '#{@thm_surface_1}'

# Load catppuccin before setting status line
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# Status line
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Shift + Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vim-style selection in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key C-k clear-history

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
